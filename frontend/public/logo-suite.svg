<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Santa Cruz Suite">
  <defs>
    <linearGradient id="scGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D18B22"/>
      <stop offset="1" stop-color="#5C2A08"/>
    </linearGradient>
    <linearGradient id="scGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C842" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F5C842" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- outer dark ring -->
  <rect x="3" y="3" width="90" height="90" rx="24" fill="#1A0902"/>
  <!-- amber-brown gradient -->
  <rect x="9" y="9" width="78" height="78" rx="19" fill="url(#scGrad)"/>
  <!-- gold shimmer top -->
  <rect x="9" y="9" width="78" height="44" rx="19" fill="url(#scGlow)"/>
  <!-- 2x2 app grid representing the suite -->
  <rect x="20" y="20" width="24" height="24" rx="6" fill="#F5EDDA" opacity="0.95"/>
  <rect x="52" y="20" width="24" height="24" rx="6" fill="#F5EDDA" opacity="0.60"/>
  <rect x="20" y="52" width="24" height="24" rx="6" fill="#F5EDDA" opacity="0.60"/>
  <rect x="52" y="52" width="24" height="24" rx="6" fill="#F5EDDA" opacity="0.95"/>
  <!-- gold accent dots -->
  <circle cx="32" cy="32" r="4" fill="#F5C842" opacity="0.90"/>
  <circle cx="64" cy="32" r="4" fill="#F5C842" opacity="0.90"/>
  <circle cx="32" cy="64" r="4" fill="#F5C842" opacity="0.90"/>
  <circle cx="64" cy="64" r="4" fill="#F5C842" opacity="0.90"/>
</svg>
